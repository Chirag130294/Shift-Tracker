<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shift Calendar</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#f3f6f4;--card:#fff;--ink:#16302b;--mute:#5d726d;--line:#d5e0dc;--acc:#1f6f5c;--acc-ink:#fff;--err:#b3261e;--ok:#1f6f5c}
@media (prefers-color-scheme:dark){:root{--bg:#10201d;--card:#172b27;--ink:#e6f1ee;--mute:#9fb5af;--line:#2a423c;--acc:#5fc4a8;--acc-ink:#0b1b17;--err:#ff8a80;--ok:#5fc4a8}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Segoe UI",Roboto,system-ui,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
main{width:100%;max-width:420px}
h1{font-size:1.9rem;margin:0 0 4px;letter-spacing:-.02em}
p.sub{margin:0 0 20px;color:var(--mute)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}
label{display:block;font-weight:600;font-size:.9rem;margin:14px 0 5px}
input{width:100%;padding:11px 12px;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px}
input:focus-visible,button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
button{font:inherit;cursor:pointer}
.primary{width:100%;margin-top:18px;padding:12px;border:0;border-radius:8px;background:var(--acc);color:var(--acc-ink);font-weight:600}
.primary:disabled{opacity:.6;cursor:wait}
.link{background:none;border:0;color:var(--acc);padding:0;text-decoration:underline}
.switch{margin:16px 0 0;text-align:center;color:var(--mute);font-size:.92rem}
.msg{margin-top:14px;font-size:.92rem;min-height:1.2em}
.msg.err{color:var(--err)}.msg.ok{color:var(--ok)}
.row{display:flex;gap:12px}.row>div{flex:1}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.hidden{display:none}
</style>
</head>
<body>
<main>
  <!-- Setup warning -->
  <div id="setup" class="card hidden">
    <h1>Almost there</h1>
    <p class="sub">Open <b>index.html</b> paste supabase url and publishable api key.</p>
  </div>

  <!-- Login / sign up -->
  <section id="auth" class="hidden">
    <h1>Shift Calendar</h1>
    <p class="sub">Sign in to keep your schedule and leave balances saved.</p>
    <div class="card">
      <h2 id="authTitle" style="margin:0;font-size:1.15rem">Log in</h2>
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="email">
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" minlength="8">
      <button id="authBtn" class="primary">Log in</button>
      <div id="authMsg" class="msg" role="status"></div>
      <p class="switch"><span id="switchText">New here?</span> <button id="switchBtn" class="link">Create an account</button></p>
      <p class="switch"><button id="resetBtn" class="link">Forgot password?</button></p>
    </div>
  </section>

  <!-- Signed-in: saved data -->
  <section id="app" class="hidden">
    <div class="top">
      <h1>Your data</h1>
      <button id="logout" class="link">Log out</button>
    </div>
    <p class="sub" id="who"></p>
    <div class="card">
      <label for="name">Name</label>
      <input id="name" type="text">
      <div class="row">
        <div><label for="vac">Vacation hours left</label><input id="vac" type="number" min="0" step="0.5"></div>
        <div><label for="sick">Sick hours left</label><input id="sick" type="number" min="0" step="0.5"></div>
      </div>
      <label for="anchor">Rotation start date (Week 1, Day 1)</label>
      <input id="anchor" type="date">
      <button id="save" class="primary">Save changes</button>
      <div id="saveMsg" class="msg" role="status"></div>
    </div>
  </section>
</main>

<script>
// ====== 1. PASTE YOUR SUPABASE VALUES HERE (Project Settings > API) ======
const SUPABASE_URL = "https://bnkhgcmuygmqaimnzimg.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_GtuYHIlvxXEYAWM0v2e_Hg_78X99cw";
// =========================================================================

const $ = id => document.getElementById(id);
const show = id => ["setup","auth","app"].forEach(s => $(s).classList.toggle("hidden", s !== id));
const say = (el, text, type) => { el.textContent = text; el.className = "msg " + (type || ""); };

if (SUPABASE_URL.startsWith("PASTE")) { show("setup"); }
else {
  const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  let signUp = false;

  $("switchBtn").onclick = () => {
    signUp = !signUp;
    $("authTitle").textContent = signUp ? "Create account" : "Log in";
    $("authBtn").textContent = signUp ? "Create account" : "Log in";
    $("switchText").textContent = signUp ? "Already have an account?" : "New here?";
    $("switchBtn").textContent = signUp ? "Log in" : "Create an account";
    $("password").autocomplete = signUp ? "new-password" : "current-password";
    say($("authMsg"), "");
  };

  $("authBtn").onclick = async () => {
    const email = $("email").value.trim(), password = $("password").value;
    if (!email || password.length < 8) return say($("authMsg"), "Enter your email and a password of at least 8 characters.", "err");
    $("authBtn").disabled = true;
    const { data, error } = signUp
      ? await db.auth.signUp({ email, password })
      : await db.auth.signInWithPassword({ email, password });
    $("authBtn").disabled = false;
    if (error) return say($("authMsg"), error.message, "err");
    if (signUp && !data.session) say($("authMsg"), "Check your email and confirm your address, then log in.", "ok");
  };

  $("resetBtn").onclick = async () => {
    const email = $("email").value.trim();
    if (!email) return say($("authMsg"), "Type your email above first.", "err");
    const { error } = await db.auth.resetPasswordForEmail(email, { redirectTo: location.href });
    say($("authMsg"), error ? error.message : "Password reset email sent.", error ? "err" : "ok");
  };

  $("logout").onclick = () => db.auth.signOut();

  async function loadData(user) {
    $("who").textContent = user.email;
    const { data, error } = await db.from("user_data").select("*").eq("user_id", user.id).maybeSingle();
    if (error) return say($("saveMsg"), error.message, "err");
    $("name").value = data?.display_name ?? "";
    $("vac").value = data?.vacation_hours ?? "";
    $("sick").value = data?.sick_hours ?? "";
    $("anchor").value = data?.rotation_anchor ?? "";
    say($("saveMsg"), "");
  }

  $("save").onclick = async () => {
    const { data: { user } } = await db.auth.getUser();
    const row = {
      user_id: user.id,
      display_name: $("name").value.trim() || null,
      vacation_hours: $("vac").value === "" ? null : Number($("vac").value),
      sick_hours: $("sick").value === "" ? null : Number($("sick").value),
      rotation_anchor: $("anchor").value || null,
      updated_at: new Date().toISOString()
    };
    const { error } = await db.from("user_data").upsert(row);
    say($("saveMsg"), error ? error.message : "Saved.", error ? "err" : "ok");
  };

  db.auth.onAuthStateChange((_event, session) => {
    if (session) { show("app"); loadData(session.user); }
    else { show("auth"); $("password").value = ""; }
  });
}
</script>
</body>
</html>
